<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E4620" />
      <stop offset="50%" stop-color="#143616" />
      <stop offset="100%" stop-color="#0A1E0B" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE072" />
      <stop offset="40%" stop-color="#F59E0B" />
      <stop offset="70%" stop-color="#FFF3B0" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="woodLayers" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2B072" />
      <stop offset="50%" stop-color="#C58B43" />
      <stop offset="100%" stop-color="#9A6321" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Base Rounded Shield Background -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="16" filter="url(#glow)" />

  <!-- Plywood Layer Lines (Subtle Craft Texture) -->
  <g opacity="0.18" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round">
    <line x1="80" y1="120" x2="432" y2="120" />
    <line x1="60" y1="200" x2="452" y2="200" />
    <line x1="60" y1="312" x2="452" y2="312" />
    <line x1="80" y1="392" x2="432" y2="392" />
  </g>

  <!-- Golden Plywood Sheets Motif (Isometric / Stacked) -->
  <path d="M160 380 L160 180 L280 180 C335 180 368 208 368 252 C368 296 335 324 280 324 L224 324 L224 380 Z" fill="url(#goldGrad)" />
  <path d="M224 232 L274 232 C296 232 308 240 308 252 C308 264 296 272 274 272 L224 272 Z" fill="#143616" />

  <!-- Sparkle Accent on Top Right -->
  <path d="M370 120 Q385 140 405 140 Q385 140 370 160 Q355 140 335 140 Q355 140 370 120 Z" fill="url(#goldGrad)" />
</svg>
